{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" class="card narrow">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn">Log in</button>
  </form>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create a tutor account</a></p>
{% endblock %}
